name: Build base image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/desiment/overleaf-cep-base

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin

      - name: Prepare Docker context
        run: cp server-ce/.dockerignore .dockerignore

      - name: Build base image
        run: |
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --progress=plain \
            --pull \
            --network=host \
            --file server-ce/Dockerfile-base \
            --tag "${BASE_IMAGE}:sha-${GITHUB_SHA}" \
            --tag "${BASE_IMAGE}:production" \
            .

      - name: Push base image
        run: |
          docker push "${BASE_IMAGE}:sha-${GITHUB_SHA}"
          docker push "${BASE_IMAGE}:production"
