name: Pull request checks

on:
  pull_request:
    branches:
      - production

permissions:
  contents: read
  packages: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_IMAGE: ghcr.io/desiment/overleaf-cep-base

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Yarn via Corepack
        run: npm install --global corepack && corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Document updater unit tests
        run: yarn workspace @overleaf/document-updater test:unit:_run

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull base image
        run: docker pull "${BASE_IMAGE}:production"
      - name: Prepare Docker context
        run: cp server-ce/.dockerignore .dockerignore
      - name: Build Overleaf image
        run: |
          docker build \
            --build-arg OVERLEAF_BASE_TAG="${BASE_IMAGE}:production" \
            --file server-ce/Dockerfile \
            --tag "overleaf-pr:${GITHUB_SHA}" \
            --network=host \
            .
