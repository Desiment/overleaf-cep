name: Pull request checks

on:
  pull_request:
    branches:
      - production

permissions:
  contents: read
  packages: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_IMAGE: ghcr.io/desiment/overleaf-cep-base

jobs:
  translations:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check extracted translations
        run: node services/web/scripts/check-extracted-translations.mjs

  build:
    needs: translations
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull base image
        run: docker pull "${BASE_IMAGE}:production"
      - name: Prepare Docker context
        run: cp server-ce/.dockerignore .dockerignore
      - name: Build Overleaf image
        run: |
          docker build \
            --build-arg OVERLEAF_BASE_TAG="${BASE_IMAGE}:production" \
            --file server-ce/Dockerfile \
            --tag "overleaf-pr:${GITHUB_SHA}" \
            --network=host \
            .
